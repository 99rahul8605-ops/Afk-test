services:
  - type: web
    name: afk-bot
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: OWNER_ID
        sync: false
      - key: AUTO_BAN_HIGH_RISK
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
