<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#060910">
  <title>Verify User</title>

  <style>
    :root{
      --bg:#060910;
      --panel:rgba(9,14,24,.78);
      --panel2:rgba(255,255,255,.035);
      --border:rgba(103,255,205,.13);
      --text:#f6fbff;
      --muted:#92a0b8;
      --green:#39ff88;
      --cyan:#00eaff;
      --blue:#5b8cff;
      --danger:#ff6377;
      --success:#57ffae;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:22px 17px;
      overflow-x:hidden;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 12% 8%,rgba(57,255,136,.11),transparent 29%),
        radial-gradient(circle at 90% 92%,rgba(0,234,255,.11),transparent 28%),
        radial-gradient(circle at 55% 45%,rgba(91,140,255,.05),transparent 32%),
        var(--bg);
    }

    .mesh{
      position:fixed;inset:0;pointer-events:none;opacity:.34;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:34px 34px;
      mask-image:linear-gradient(to bottom,#000,transparent 92%);
    }

    .orb{position:fixed;border-radius:999px;filter:blur(72px);pointer-events:none;opacity:.24}
    .orb.a{width:270px;height:270px;background:#27ff98;left:-100px;top:-90px;animation:driftA 8s ease-in-out infinite alternate}
    .orb.b{width:320px;height:320px;background:#00d9ff;right:-130px;bottom:-130px;animation:driftB 9s ease-in-out infinite alternate}

    .wrap{width:min(100%,455px);position:relative}
    .card{
      border:1px solid var(--border);
      border-radius:29px;
      padding:30px 23px 22px;
      overflow:hidden;
      position:relative;
      background:
        linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.008)),
        var(--panel);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      box-shadow:0 30px 90px rgba(0,0,0,.52);
    }

    .card:before{
      content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
      background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 27%,rgba(57,255,136,.24),rgba(0,234,255,.23));
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
    }

    .pill{
      width:max-content;margin:0 auto 18px;display:flex;align-items:center;gap:8px;
      color:#ced8ea;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.075);
      padding:8px 12px;border-radius:999px;font-size:12px;letter-spacing:.03em;
    }
    .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 18px rgba(57,255,136,.8);animation:pulse 1.7s ease-in-out infinite}

    .visual{width:108px;height:108px;margin:0 auto 19px;display:grid;place-items:center;position:relative}
    .ring{position:absolute;inset:0;border:1px solid rgba(255,255,255,.075);border-radius:50%}
    .ring:before{content:"";position:absolute;inset:9px;border:1px solid rgba(57,255,136,.18);border-radius:50%}
    .spin{position:absolute;inset:0;border-radius:50%;border-top:2px solid var(--green);border-right:2px solid transparent;filter:drop-shadow(0 0 11px rgba(57,255,136,.65));animation:spin 2.7s linear infinite}
    .core{
      width:67px;height:67px;border-radius:22px;display:grid;place-items:center;
      font-size:30px;font-weight:900;color:#04120c;
      background:linear-gradient(145deg,var(--green),var(--cyan));
      box-shadow:0 0 38px rgba(0,234,255,.14),0 17px 46px rgba(57,255,136,.2),inset 0 1px 0 rgba(255,255,255,.4);
    }

    h1{margin:0;text-align:center;font-size:28px;line-height:1.15;letter-spacing:-.028em}
    .sub{margin:10px auto 23px;max-width:320px;text-align:center;color:var(--muted);font-size:14px;line-height:1.55}

    .user{
      display:flex;align-items:center;gap:13px;padding:13px 14px;margin-bottom:14px;border-radius:18px;
      border:1px solid var(--border);background:var(--panel2);
    }
    .avatar{
      width:43px;height:43px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
      color:#04120c;font-weight:900;background:linear-gradient(135deg,var(--green),var(--cyan));
      box-shadow:0 10px 28px rgba(57,255,136,.16);
    }
    .copy{min-width:0;flex:1}
    .small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
    .name{font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tick{
      width:29px;height:29px;display:grid;place-items:center;border-radius:50%;
      color:var(--muted);border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035)
    }
    .tick.ok{color:var(--success);border-color:rgba(87,255,174,.26);background:rgba(87,255,174,.1)}

    .progress{
      padding:15px 14px;border-radius:18px;border:1px solid var(--border);
      background:rgba(255,255,255,.025);margin-bottom:14px;
    }
    .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:10px}
    .ph strong{color:#dce9f5;font-weight:650}
    .track{height:8px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06)}
    .bar{
      width:0;height:100%;border-radius:inherit;
      background:linear-gradient(90deg,var(--green),var(--cyan),var(--blue));
      box-shadow:0 0 22px rgba(57,255,136,.5);
      transition:width .32s ease;
    }

    .status{
      min-height:48px;display:flex;gap:10px;align-items:center;padding:12px 13px;margin-bottom:15px;
      border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.025);
      color:var(--muted);font-size:13px;line-height:1.42;
    }
    .status.success{color:#caffea;border-color:rgba(87,255,174,.26);background:rgba(87,255,174,.075)}
    .status.error{color:#ffd1d7;border-color:rgba(255,99,119,.28);background:rgba(255,99,119,.07)}
    .si{width:24px;height:24px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.05)}

    .btn{
      width:100%;min-height:53px;border:0;border-radius:16px;position:relative;overflow:hidden;
      cursor:pointer;color:white;font-size:15px;font-weight:850;letter-spacing:.01em;
      background:linear-gradient(135deg,#39ff88,#00ffa6 34%,#00eaff 72%,#5b8cff);
      box-shadow:0 14px 36px rgba(57,255,136,.18),inset 0 1px 0 rgba(255,255,255,.3);
      text-shadow:0 0 12px rgba(255,255,255,.18);
      transition:transform .17s ease,opacity .17s ease,filter .17s ease;
    }
    .btn:active{transform:scale(.985)}
    .btn:disabled{cursor:not-allowed;opacity:.68;filter:saturate(.8)}
    .btn:after{
      content:"";position:absolute;inset:-65% -35%;
      background:linear-gradient(105deg,transparent 39%,rgba(255,255,255,.3) 50%,transparent 61%);
      transform:translateX(-58%);animation:shine 3.1s ease-in-out infinite;pointer-events:none;
    }

    .foot{
      margin-top:14px;text-align:center;color:#738199;font-size:10.5px;line-height:1.45;
    }

    .loader{
      display:inline-block;width:14px;height:14px;margin-right:8px;border-radius:50%;
      border:2px solid rgba(255,255,255,.28);border-top-color:#fff;
      vertical-align:-2px;animation:spin .7s linear infinite;
    }

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.6;transform:scale(.9)}50%{opacity:1;transform:scale(1.2)}}
    @keyframes shine{0%,56%{transform:translateX(-58%)}78%,100%{transform:translateX(58%)}}
    @keyframes driftA{to{transform:translate(20px,24px)}}
    @keyframes driftB{to{transform:translate(-18px,-22px)}}

    @media(max-width:420px){
      .card{padding:27px 18px 20px;border-radius:25px}
      h1{font-size:25px}
      .visual{width:98px;height:98px}
      .core{width:60px;height:60px;border-radius:20px;font-size:27px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important}
    }
  </style>
</head>

<body>
  <div class="mesh"></div>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <main class="wrap">
    <section class="card">
      <div class="pill"><span class="pulse"></span><span>Secure verification</span></div>

      <div class="visual">
        <div class="ring"></div>
        <div class="spin"></div>
        <div class="core">✓</div>
      </div>

      <h1>Verify User</h1>
      <p class="sub">Tap below to complete verification and continue.</p>

      <div class="user">
        <div class="avatar" id="avatar">U</div>
        <div class="copy">
          <div class="small">Telegram account</div>
          <div class="name" id="tgUser">Detecting user...</div>
        </div>
        <div class="tick" id="userTick">•</div>
      </div>

      <div class="progress">
        <div class="ph">
          <strong id="progressLabel">Ready</strong>
          <span id="progressPercent">0%</span>
        </div>
        <div class="track"><div class="bar" id="progressBar"></div></div>
      </div>

      <div class="status" id="statusBox">
        <div class="si" id="statusIcon">⏳</div>
        <div id="statusText">Ready to verify.</div>
      </div>

      <button class="btn" id="verifyBtn" type="button">Verify Now</button>

      <div class="foot">
        Security verification may process account, device/browser and network signals for abuse prevention.
      </div>
    </section>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram?.WebApp;
    const user = tg?.initDataUnsafe?.user || null;

    const el = id => document.getElementById(id);
    const tgUser = el("tgUser");
    const pageTitle = document.querySelector("h1");
    const pageSub = document.querySelector(".sub");
    const coreIcon = document.querySelector(".core");
    const avatar = el("avatar");
    const userTick = el("userTick");
    const verifyBtn = el("verifyBtn");
    const statusBox = el("statusBox");
    const statusText = el("statusText");
    const statusIcon = el("statusIcon");
    const progressBar = el("progressBar");
    const progressLabel = el("progressLabel");
    const progressPercent = el("progressPercent");

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function setProgress(n,label){
      n=Math.max(0,Math.min(100,Number(n)||0));
      progressBar.style.width=n+"%";
      progressPercent.textContent=n+"%";
      progressLabel.textContent=label||"";
    }

    function setStatus(text,type=""){
      statusText.textContent=text;
      statusBox.className="status"+(type?" "+type:"");
      statusIcon.textContent=type==="success"?"✓":type==="error"?"!":"⏳";
    }

    function showBannedScreen(groupName){
      const safeName=groupName||"this group";
      pageTitle.textContent="Access Denied";
      pageSub.textContent=`You have been banned from ${safeName}.`;
      coreIcon.textContent="🚫";
      setProgress(100,"Blocked");
      setStatus("Your verification was blocked because this device is linked to an account that is currently banned. Please contact the group administrator.","error");
      verifyBtn.disabled=true;
      verifyBtn.textContent="Banned";
      document.querySelector(".foot").textContent="If you believe this is a mistake, contact the group administrator for assistance.";
      if(tg?.HapticFeedback){
        tg.HapticFeedback.notificationOccurred("error");
      }
    }

    if(user){
      const display=[user.first_name||"",user.last_name||""].filter(Boolean).join(" ").trim();
      const shown=display||(user.username?"@"+user.username:String(user.id));
      tgUser.textContent=shown;
      avatar.textContent=(display||user.username||"U").trim().charAt(0).toUpperCase();
      userTick.textContent="✓";
      userTick.classList.add("ok");
    } else {
      tgUser.textContent="Telegram user unavailable";
      userTick.textContent="!";
      setStatus("Open verification from Telegram.","error");
    }

    async function sha256(text){
      const bytes=new TextEncoder().encode(text);
      const hash=await crypto.subtle.digest("SHA-256",bytes);
      return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
    }

    function canvasSignal(){
      try{
        const c=document.createElement("canvas");
        c.width=280;c.height=72;
        const x=c.getContext("2d");
        x.textBaseline="top";
        x.font="16px Arial";
        x.fillStyle="#f60";x.fillRect(0,0,280,72);
        x.fillStyle="#069";x.fillText("Verify TG • 58291 • Ω",8,8);
        x.fillStyle="rgba(102,204,0,.7)";x.fillText("Secure ✓",16,32);
        return c.toDataURL();
      }catch(e){return "canvas-unavailable"}
    }

    async function fingerprint(){
      const raw=[
        navigator.userAgent||"",
        navigator.language||"",
        navigator.languages?.join(",")||"",
        navigator.platform||"",
        screen.width,screen.height,screen.colorDepth,
        window.devicePixelRatio||1,
        Intl.DateTimeFormat().resolvedOptions().timeZone||"",
        navigator.hardwareConcurrency||"",
        navigator.deviceMemory||"",
        navigator.maxTouchPoints||"",
        canvasSignal()
      ].join("|");
      return sha256(raw);
    }

    const wait=ms=>new Promise(r=>setTimeout(r,ms));

    async function verify(){
      if(!tg||!user){
        setStatus("Verification must be opened inside Telegram.","error");
        return;
      }

      verifyBtn.disabled=true;
      verifyBtn.innerHTML='<span class="loader"></span>Verifying';

      try{
        setProgress(18,"Preparing");
        setStatus("Starting verification...");
        await wait(180);

        setProgress(47,"Checking");
        setStatus("Verifying user...");
        const fp=await fingerprint();
        await wait(200);

        setProgress(72,"Confirming");
        setStatus("Confirming verification...");

        const params=new URLSearchParams(window.location.search);
        const groupId=params.get("group_id");

        const payload={
          initData:tg.initData,
          telegram_user_id:user.id,
          group_id:groupId,
          fingerprint:fp,
          timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||null,
          language:navigator.language||null,
          platform:navigator.platform||null,
          user_agent:navigator.userAgent||null,
          screen:`${screen.width}x${screen.height}`,
          hardware_concurrency:navigator.hardwareConcurrency||null,
          max_touch_points:navigator.maxTouchPoints||null,
          timestamp:new Date().toISOString()
        };

        const res=await fetch("/api/verify",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(payload)
        });

        let data={};
        try{data=await res.json()}catch(e){}

        if(data.status==="restricted"){
          showBannedScreen(data.group_name);
          return;
        }

        if(!res.ok||!data.ok){
          throw new Error(data.message||"Verification could not be approved.");
        }

        setProgress(100,"Complete");
        setStatus(data.message||"Verification completed successfully.","success");
        verifyBtn.textContent="Verified ✓";

        if(tg?.HapticFeedback){
          tg.HapticFeedback.notificationOccurred("success");
        }
      }catch(err){
        setProgress(0,"Ready");
        setStatus(err?.message||"Verification failed. Please try again.","error");
        verifyBtn.disabled=false;
        verifyBtn.textContent="Try Again";

        if(tg?.HapticFeedback){
          tg.HapticFeedback.notificationOccurred("error");
        }
      }
    }

    verifyBtn.addEventListener("click",verify);
  </script>
</body>
</html>
